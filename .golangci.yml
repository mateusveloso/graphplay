version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - revive
    - gocritic
    - nilerr
    - errorlint
    - bodyclose
    - noctx
    - unconvert
    - prealloc
  settings:
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
  exclusions:
    rules:
      - path: _test\.go
        linters: [bodyclose, noctx, prealloc]

formatters:
  enable:
    - gofmt
    - goimports
