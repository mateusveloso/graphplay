<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graphplay</title>
<style>
  :root { --bg: #0e1116; --panel: #161b22; --line: #2a313c; --fg: #d7dde6; --dim: #8b949e;
          --code: #9aa4b2; --decision: #2dd4bf; --small: #f59e0b; --large: #a78bfa; --human: #4ade80; --active: #f2cc60; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; min-height: 100vh; display: grid; place-items: center; }
  main { max-width: 860px; padding: 48px 28px; }
  h1 { font-size: 40px; margin: 0 0 6px; letter-spacing: -.01em; }
  .sub { color: var(--dim); font-size: 18px; margin-bottom: 36px; }
  h2 { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; margin: 28px 0 10px; }
  p { margin: 0 0 10px; }
  .ladder { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px 14px; align-items: center; }
  .ladder .sw { width: 14px; height: 14px; border-radius: 4px; }
  .ladder .cost { color: var(--dim); font-size: 14px; text-align: right; }
  .rules { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 28px; }
  .rules div::before { content: "›  "; color: var(--active); }
  .go { margin-top: 40px; display: flex; gap: 16px; align-items: center; }
  .go a { background: var(--active); color: #111; font-weight: 700; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-size: 15px; white-space: nowrap; flex: none; }
  .go a:hover { filter: brightness(1.08); }
  .go span { color: var(--dim); font-size: 14px; }
  .lang { position: fixed; top: 14px; right: 16px; font-size: 13px; }
  .lang a { color: var(--dim); text-decoration: none; margin-left: 10px; }
  .lang a.on { color: var(--fg); }
</style>
</head>
<body>
<div class="lang"><a id="l-en" href="/?lang=en">en</a><a id="l-pt" href="/?lang=pt">pt-BR</a></div>
<main id="main"></main>
<script>
const lang = new URLSearchParams(location.search).get("lang") === "pt" ? "pt" : "en";
document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
document.getElementById("l-" + lang).classList.add("on");
const copy = {
  en: {
    title: "graphplay", sub: "a graph plays a text adventure, and every move says who decided",
    game: "The game", gameP: ["Thirteen rooms, a lantern, a coin, a troll who takes a toll, two riddle doors, one fork where only an inscription says which arch is safe, and a chest.",
      "The player sees what a person would: prose, exits, visible items. The map is never given. Dangers live in the text. Death reloads the moment before the fatal command."],
    player: "The player is a graph", playerP: ["Nine nodes. Code owns the map, the inventory and what is legal. Models are consulted only for what code cannot decide, and each decision goes to the cheapest layer that can take it:"],
    ladder: [["code", "code", "free"], ["decision-model", "decision model (Jev): reads the prose, answers with probabilities, cannot write", "cents"], ["small-llm", "small model: proposes commands when code is out of safe moves", "cheap"], ["large-llm", "large model: the riddles, and the fork when the decision model is unsure", "expensive"], ["human", "human: after deaths, idle turns or wrong answers", "the most expensive"]],
    see: "What you will see", seeP: ["The map being drawn as the player learns it. Every exit coloured by the decision model's verdict, with its risk written.", "A thread from the node of the graph that decided to the move on the map, in the colour of the layer, with the name of who decided.", "A card with the why: the numbers, the rule, or the model's reasoning.", "Space pauses the graph between two nodes, so you can look."],
    go: "watch the graph play", goHint: "the game runs live against real models; nothing is recorded or replayed",
  },
  pt: {
    title: "graphplay", sub: "um grafo joga uma aventura de texto, e cada jogada diz quem decidiu",
    game: "O jogo", gameP: ["Treze salas, uma lanterna, uma moeda, um troll que cobra pedágio, duas portas com enigma, uma bifurcação em que só uma inscrição diz qual arco é seguro, e um baú.",
      "O jogador vê o que uma pessoa veria: prosa, saídas, itens visíveis. O mapa nunca é entregue. Os perigos estão no texto. Morrer recarrega o momento anterior ao comando fatal."],
    player: "O jogador é um grafo", playerP: ["Nove nós. Código é dono do mapa, do inventário e do que é legal. Modelos só são consultados para o que código não decide, e cada decisão vai para a camada mais barata que consegue tomá-la:"],
    ladder: [["code", "código", "grátis"], ["decision-model", "modelo de decisão (Jev): lê a prosa, responde com probabilidades, não escreve", "centavos"], ["small-llm", "modelo pequeno: propõe comandos quando o código ficou sem jogada segura", "barato"], ["large-llm", "modelo grande: os enigmas, e a bifurcação quando o modelo de decisão está inseguro", "caro"], ["human", "humano: depois de mortes, turnos parados ou respostas erradas", "o mais caro"]],
    see: "O que você vai ver", seeP: ["O mapa sendo desenhado conforme o jogador descobre. Cada saída na cor do veredito do modelo de decisão, com o risco escrito.", "Um fio do nó do grafo que decidiu até a jogada no mapa, na cor da camada, com o nome de quem decidiu.", "Um cartão com o porquê: os números, a regra, ou o raciocínio do modelo.", "A barra de espaço pausa o grafo entre dois nós, para você olhar com calma."],
    go: "ver o grafo jogar", goHint: "a partida roda ao vivo contra modelos reais; nada é gravado nem repetido",
  },
}[lang];
const colors = { code: "var(--code)", "decision-model": "var(--decision)", "small-llm": "var(--small)", "large-llm": "var(--large)", human: "var(--human)" };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.getElementById("main").innerHTML = `
  <h1>${copy.title}</h1>
  <div class="sub">${esc(copy.sub)}</div>
  <h2>${esc(copy.game)}</h2>${copy.gameP.map((p) => `<p>${esc(p)}</p>`).join("")}
  <h2>${esc(copy.player)}</h2>${copy.playerP.map((p) => `<p>${esc(p)}</p>`).join("")}
  <div class="ladder">${copy.ladder.map(([l, t, c]) => `<span class="sw" style="background:${colors[l]}"></span><span>${esc(t)}</span><span class="cost">${esc(c)}</span>`).join("")}</div>
  <h2>${esc(copy.see)}</h2><div class="rules">${copy.seeP.map((p) => `<div>${esc(p)}</div>`).join("")}</div>
  <div class="go"><a href="/map.html?lang=${lang}">${esc(copy.go)} →</a><span>${esc(copy.goHint)}</span></div>`;
</script>
</body>
</html>
