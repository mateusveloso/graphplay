<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graphplay</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #2a313c; --fg: #d7dde6; --dim: #8b949e;
    --code: #8b949e; --decision: #2dd4bf; --small: #f59e0b; --large: #a78bfa; --human: #4ade80;
    --active: #f2cc60;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header .spacer { flex: 1; }
  select, button, input { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; }
  button { cursor: pointer; } button:hover { border-color: var(--dim); } button:disabled { opacity: .4; cursor: default; }
  main { display: grid; grid-template-columns: 1.1fr 1fr; grid-template-rows: auto 1fr; gap: 12px; padding: 12px 16px; height: calc(100vh - 49px); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; min-height: 0; }
  .panel h2 { margin: 0 0 8px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  #graph { grid-row: 1 / span 2; display: flex; flex-direction: column; }
  #graph svg { width: 100%; height: auto; max-height: 100%; }
  #now .node { font-size: 18px; font-weight: 600; }
  #now .what { color: var(--dim); margin-top: 2px; }
  #now .detail { margin-top: 10px; white-space: pre-wrap; }
  .layer { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid; }
  .layer.code { color: var(--code); border-color: var(--code); }
  .layer.decision-model { color: var(--decision); border-color: var(--decision); }
  .layer.small-llm { color: var(--small); border-color: var(--small); }
  .layer.large-llm { color: var(--large); border-color: var(--large); }
  .layer.human { color: var(--human); border-color: var(--human); }
  #screen .room { font-size: 16px; font-weight: 600; }
  #screen .desc { margin: 6px 0 10px; color: #c9d1d9; }
  #screen .meta span { color: var(--dim); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; font-size: 12px; }
  td.n { color: var(--dim); width: 2.5em; }
  #ledger { grid-column: 2; }
  .summary { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 10px; }
  .summary .layer b { margin-left: 6px; }
  #gate { display: none; border-color: var(--human); }
  #gate.on { display: block; }
  #gate .why { color: var(--human); margin-bottom: 8px; }
  #gate form { display: flex; gap: 8px; }
  #gate input { flex: 1; }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .died { color: #f87171; }
  .muted { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>graphplay</h1>
  <span class="muted">the graph plays; every turn says who decided</span>
  <span class="spacer"></span>
  <select id="world"></select>
  <button id="start">play</button>
</header>
<main>
  <section class="panel" id="graph"><h2>graph</h2><div id="mermaid" class="muted">loading…</div></section>
  <section class="panel" id="right-top">
    <div id="now"><h2>now</h2><div class="node muted">idle</div><div class="what"></div><div class="detail"></div></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
    <div id="screen"><h2>what the player sees</h2><div class="room muted">—</div><div class="desc"></div><div class="meta"></div></div>
    <div class="panel" id="gate"><h2>the graph needs you</h2><div class="why"></div>
      <form id="gateform"><input id="cmd" placeholder='a command, e.g. "go north"' autocomplete="off"><button type="submit">send</button><button type="button" id="stop">stop</button></form>
    </div>
  </section>
  <section class="panel" id="ledger">
    <h2>ledger</h2>
    <div class="summary" id="summary"></div>
    <table><thead><tr><th>#</th><th>room</th><th>command</th><th>decided by</th><th>note / outcome</th></tr></thead><tbody id="rows"></tbody></table>
    <h2 style="margin-top:14px">model usage</h2>
    <table><thead><tr><th>model</th><th class="num">calls</th><th class="num">in</th><th class="num">out</th><th class="num">time</th></tr></thead><tbody id="usage"></tbody></table>
  </section>
</main>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
mermaid.initialize({ startOnLoad: false, theme: "dark", flowchart: { curve: "basis" } });

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const layer = (l) => `<span class="layer ${esc(l)}">${esc(l)}</span>`;

let diagram = await (await fetch("/graph.mmd")).text();
let renderSeq = 0;
async function drawGraph(active) {
  // The committed diagram is drawn for a light page; restyle it for this one.
  const dark = "\n\tclassDef default fill:#1f2630,stroke:#8b949e,color:#d7dde6;\n\tclassDef first fill:#1f2630,stroke:#8b949e,color:#d7dde6;\n\tclassDef last fill:#2a2440,stroke:#a78bfa,color:#d7dde6;\n";
  const text = diagram + dark + (active ? `\tclassDef active fill:#f2cc60,color:#111,stroke:#f2cc60,stroke-width:2px;\n\tclass ${active} active;\n` : "");
  const id = "g" + (++renderSeq);
  try {
    const { svg } = await mermaid.render(id, text);
    $("#mermaid").innerHTML = svg;
  } catch (e) { $("#mermaid").textContent = e.message; }
}
await drawGraph(null);

const worlds = await (await fetch("/worlds")).json();
for (const w of worlds.worlds) { const o = document.createElement("option"); o.value = o.textContent = w; o.selected = w === worlds.default; $("#world").append(o); }

const whatFor = {
  observe:    () => "code replays the command log and refreshes the screen",
  assess:     () => "decision model reads the prose: kind of place, danger and protection per exit",
  cheap_move: () => "code: items, safe frontier, known map, look",
  propose:    () => "small model proposes candidate commands",
  rank:       () => "code filters legality; decision model picks among the survivors",
  solve:      () => "large model reads the riddle",
  act:        () => "code applies the command to the engine",
  gate:       () => "a human is asked",
  finalize:   () => "code writes the report",
};

let startedAt = null, timer = null;
function spinner(node) {
  clearInterval(timer);
  startedAt = Date.now();
  const tick = () => { const s = ((Date.now() - startedAt) / 1000).toFixed(1); $("#now .what").textContent = `${whatFor[node]?.() ?? ""}  · ${s}s`; };
  tick();
  timer = setInterval(tick, 100);
}

function fmtRisk(k, dirs) {
  if (!k || !k.risk) return "";
  return dirs.map((d) => `${d}: danger ${(k.danger?.[d] ?? 0).toFixed(2)} · protected ${(k.protected?.[d] ?? 0).toFixed(2)} → risk ${(k.risk[d] ?? 0).toFixed(2)}`).join("\n");
}

function detailFor(e) {
  const s = e.state, obs = s.obs || {}, k = s.map?.[obs.room];
  switch (e.node) {
    case "assess":   return e.phase === "done" ? `kind: ${k?.kind ?? "?"}\n${fmtRisk(k, obs.exits || [])}` : "";
    case "cheap_move": return e.phase === "done" ? (s.chosen ? `→ ${s.chosen.command}${s.chosen.note ? "   (" + s.chosen.note + ")" : ""}` : "nothing safe left to do; asking the models") : "";
    case "propose":  return e.phase === "done" ? `candidates: ${(s.candidates || []).join(" · ")}` : "";
    case "rank":     return e.phase === "done" ? (s.chosen ? `→ ${s.chosen.command}   (${s.chosen.layer}${s.chosen.note ? ", " + s.chosen.note : ""})` : "no legal candidate; a human is next") : "";
    case "solve":    return e.phase === "done" && s.chosen ? `→ ${s.chosen.command}\n\n${s.chosen.note || ""}` : (obs.riddle ? `riddle: ${obs.riddle}` : "");
    case "act":      { const last = s.ledger?.[s.ledger.length - 1]; return e.phase === "done" && last ? `${last.command} → ${last.died ? "DIED, reloaded" : (last.outcome || "moved")}` : ""; }
    case "gate":     return e.pause?.payload?.why ? `why: ${e.pause.payload.why}` : "";
    default:         return "";
  }
}

function render(e) {
  if (e.phase === "error") { $("#now .node").textContent = "error"; $("#now .what").textContent = e.error; clearInterval(timer); return; }
  const s = e.state, obs = s.obs || {};
  drawGraph(e.phase === "end" ? null : e.node);

  $("#now .node").className = "node"; $("#now .node").textContent = e.phase === "end" ? (s.won ? "won" : s.stopped ? "stopped" : "finished") : e.node;
  if (e.phase === "start" && ["assess", "propose", "rank", "solve"].includes(e.node)) { $("#now .node").classList.add("pulse"); spinner(e.node); }
  else { clearInterval(timer); $("#now .what").textContent = e.phase === "end" ? "" : `${whatFor[e.node]?.() ?? ""}${e.took ? "  · " + (e.took / 1e9).toFixed(2) + "s" : ""}`; }
  $("#now .detail").textContent = detailFor(e);

  if (obs.name) {
    $("#screen .room").className = "room"; $("#screen .room").textContent = `${obs.name}  ·  turn ${s.turn}  ·  deaths ${s.deaths}`;
    $("#screen .desc").textContent = obs.description || "";
    $("#screen .meta").innerHTML = `<span>exits</span> ${esc((obs.exits || []).join(", "))}<br><span>items</span> ${esc((obs.items || []).join(", ") || "none")}<br><span>inventory</span> ${esc((obs.inventory || []).join(", ") || "empty")}` + (obs.riddle ? `<br><span>riddle</span> ${esc(obs.riddle)}` : "") + (obs.message ? `<br><span>last</span> ${esc(obs.message)}` : "");
  }

  const rows = (s.ledger || []).map((l) => `<tr><td class="n">${l.turn}</td><td>${esc(l.room)}</td><td>${esc(l.command)}</td><td>${layer(l.layer)}</td><td>${l.died ? '<span class="died">died, reloaded</span> ' : ""}${esc(l.note || l.outcome || "")}</td></tr>`);
  $("#rows").innerHTML = rows.join("");
  const counts = {}; for (const l of s.ledger || []) counts[l.layer] = (counts[l.layer] || 0) + 1;
  $("#summary").innerHTML = ["code", "decision-model", "small-llm", "large-llm", "human"].filter((l) => counts[l]).map((l) => `<span class="layer ${l}">${l}<b>${counts[l]}</b></span>`).join("");
  $("#usage").innerHTML = (e.usage || []).map((u) => `<tr><td>${esc(u.model)}</td><td class="num">${u.calls}</td><td class="num">${u.input_tokens}</td><td class="num">${u.output_tokens}</td><td class="num">${(u.duration / 1e9).toFixed(1)}s</td></tr>`).join("");

  const gate = $("#gate");
  if (e.phase === "paused") { gate.classList.add("on"); $("#gate .why").textContent = e.pause?.payload?.why || ""; $("#cmd").focus(); }
  else gate.classList.remove("on");
  $("#start").disabled = !(e.phase === "end" || e.phase === "paused" || e.phase === "error");
  const tbody = $("#rows"); tbody.parentElement.parentElement.scrollTop = tbody.parentElement.parentElement.scrollHeight;
}

const es = new EventSource("/events");
es.onmessage = (m) => render(JSON.parse(m.data));

$("#start").onclick = async () => {
  $("#start").disabled = true;
  const r = await fetch(`/start?world=${encodeURIComponent($("#world").value)}`, { method: "POST" });
  if (!r.ok) { $("#now .what").textContent = await r.text(); $("#start").disabled = false; }
};
$("#gateform").onsubmit = async (ev) => { ev.preventDefault(); await fetch("/resume", { method: "POST", body: JSON.stringify({ command: $("#cmd").value }) }); $("#cmd").value = ""; };
$("#stop").onclick = async () => { await fetch("/resume", { method: "POST", body: JSON.stringify({ stop: true }) }); };
</script>
</body>
</html>
